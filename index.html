    text:"Online learning has become increasingly popular in higher education. Unlike traditional classrooms, online courses allow students to learn at their own {{16}} and review difficult materials whenever they want. This flexibility is {{17}} beneficial to students who have part-time jobs. However, online learning also {{18}} strong self-discipline. Without a teacher watching over them, some students may {{19}} until the last minute and then rush through the material. To {{20}} in an online course, students should create a weekly study plan and set clear goals. They should also take an active part in online discussions, which can make learning less {{21}}. Research shows that students who communicate {{22}} with instructors usually perform better. In the future, online learning will probably not {{23}} traditional education, but it will certainly become an important part of it." },

const $ = s=>document.querySelector(s);
const fmt = sec=>{ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); };
const esc = s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* 单题得分率：全对1，半对半错按比例扣分 */
function ratioOf(q, sel){
  if(!sel || !sel.length) return 0;
  const right = sel.filter(k=>q.a.includes(k)).length;
  const wrong = sel.filter(k=>!q.a.includes(k)).length;
  return Math.max(0,(right-wrong))/q.a.length;
}

/* 浏览器语音合成播放听力（无音频文件也能“听”） */
function speakGroup(key, ev){
  const t = PASSAGES[key].text;
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音播放，请在解析中查看听力原文。'); return; }
  if(speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); return; }
  const u = new SpeechSynthesisUtterance(t.replace(/\s+/g,' '));
  u.lang='en-US'; u.rate=.92;
  speechSynthesis.speak(u);
  if(ev){ const b=ev.currentTarget; b.classList.add('playing'); u.onend=()=>b.classList.remove('playing'); }
}

  const avg = examCount?Math.round(history.reduce((a,b)=>a+b.total,0)/examCount):0;
  const best= examCount?Math.max(...history.map(h=>h.total)):0;
  const attempts = Object.values(pLog).reduce((a,b)=>a+b.n,0);
  const cards=[
    {label:'模考次数',value:examCount,sub:'场全真模拟',color:'bg-blue-600'},
    {label:'错题数量',value:wrongBook.length,sub:'道待复习',color:'bg-red-500'},
    {label:'累计刷题',value:attempts,sub:'次答题记录',color:'bg-teal-600'},
    {label:'历史最高',value:best||'--',sub:'平均分 '+avg,color:'bg-amber-500'}
  ];
  return cards.map(c=>`
    <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-center gap-4 shadow-sm">
      <div class="${c.color} w-11 h-11 rounded-lg text-white flex items-center justify-center text-lg font-bold">${String(c.value).slice(0,2)}</div>

}

function beginExam(cont){
  const d = cont?LS.get(K.draft,null):null;
  exam = {
    answers: d?.answers||{},
    marks:   d?.marks||{},
    idx:     d?.idx||0,
    remaining:d?.remaining??EXAM_MIN*60
  };
  if(!cont) LS.del(K.draft);
  go('exam');
  renderExamQuestion();
  startTimer();
  window.onbeforeunload = ()=>'考试正在进行，确定离开本页吗？';
}

function startTimer(){
  if(timerId) clearInterval(timerId);
  updateTimer();
  timerId=setInterval(()=>{
    exam.remaining--;
    saveDraft();
    updateTimer();
    if(exam.remaining<=0){ clearInterval(timerId); timerId=null; finishExam(true); }
  },1000);
}
function updateTimer(){
  const el=$('#timer-text'); if(!el) return;
  el.textContent=fmt(Math.max(0,exam.remaining));
  el.classList.toggle('timer-danger',exam.remaining<=300);
  el.classList.toggle('bg-red-600',exam.remaining<=300);
  el.classList.toggle('bg-white/15',exam.remaining>300);
}
function saveDraft(){
  LS.set(K.draft,{answers:exam.answers,marks:exam.marks,idx:exam.idx,remaining:exam.remaining});
}

function answeredOf(id){ return !!exam.answers[id] && exam.answers[id].length>0; }

  else c+='bg-white border-slate-300 text-slate-600 ';
  if(exam.marks[id]) c+='ring-2 ring-amber-400 ring-inset ';
  if(id===QUESTIONS[exam.idx].id) c+='outline outline-2 outline-offset-1 outline-slate-800 ';
  return c;
}
function cellInner(id){ return id+(exam.marks[id]?'<span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-amber-400 border border-white"></span>':''); }
function syncCells(){
  QUESTIONS.forEach(q=>document.querySelectorAll(`[data-cell="${q.id}"]`).forEach(el=>{
    el.className=cellClass(q.id); el.innerHTML=cellInner(q.id);
  }));
  $('#answered-cnt').textContent=answeredCount();
  $('#fab-cnt').textContent=answeredCount();
}
function answeredCount(){ return QUESTIONS.filter(q=>answeredOf(q.id)).length; }

/* ---------- 题目区渲染 ---------- */
function audioCard(key){
  return `<div class="bg-slate-50 border border-slate-200 rounded-lg p-3 flex items-center gap-3">
    <button onclick="speakGroup('${key}',event)" class="play-btn flex-none w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center">▶</button>
    <div><p class="font-semibold text-slate-700 text-sm">${PASSAGES[key].title}</p>
    <p class="text-xs text-slate-400">点击播放录音 / 播放中再点停止</p></div>
  </div>`;
}
function passageBlock(q){
  const p=PASSAGES[q.group]; if(!p) return '';
  const first = !QUESTIONS[exam.idx-1] || QUESTIONS[exam.idx-1].group!==q.group;
  if(p.type==='audio'){
    return first?audioCard(q.group):`<details class="bg-white border border-slate-200 rounded-lg"><summary class="p-3 text-sm text-slate-600">🎧 重听本段录音（${p.title}）</summary><div class="px-3 pb-3">${audioCard(q.group)}</div></details>`;
  }
  let body='';
  if(p.dir) body+=`<p class="text-sm text-slate-500 mb-2">${p.dir}</p>`;
  if(p.type==='match'){
    body+='<div class="space-y-3">'+p.paragraphs.map(x=>`<p class="text-[15px] leading-relaxed"><b class="text-blue-700 mr-1">[${x.k}]</b>${x.t}</p>`).join('')+'</div>';
  }else{
    body+=`<p class="text-[15px] leading-relaxed">${p.text.replace(/\{\{(\d+)\}\}/g,'<b class="text-blue-700 not-italic"> [$1] </b>')}</p>`;
  }
  return `<details ${first?'open':''} class="passage-details bg-white border border-slate-200 rounded-lg mb-4">
    <summary class="p-3 text-sm font-semibold text-slate-700">📖 ${p.title}</summary>
    <div class="px-4 pb-4">${body}</div></details>`;
}

function questionOptionsHTML(q, sel){
  return Object.entries(q.o).map(([k,v])=>{
    const on=sel.includes(k);
    return `<button onclick="selectOpt('${k}')" class="opt w-full flex items-start gap-3 p-3 rounded-lg border text-left transition
      ${on?'opt-act border-blue-600 bg-blue-50 ring-1 ring-blue-600':'border-slate-300 bg-white hover:border-blue-400 hover:bg-blue-50/50'}">
      <span class="letter-badge mt-0.5">${k}</span><span class="flex-1 text-[15px]">${v}</span></button>`;
  }).join('');
}

function renderExamQuestion(){
  const q=QUESTIONS[exam.idx], sel=exam.answers[q.id]||[];
  $('#q-area').innerHTML=`
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 sm:p-5">
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <span class="text-xs px-2 py-0.5 rounded ${SECTIONS[q.section].cls} font-semibold">${SECTIONS[q.section].name}</span>
        <span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600">${q.type==='multi'?'多选题':'单选题'}</span>
        <span class="text-xs text-slate-400">第 ${q.id} 题 / 共 ${TOTAL_Q} 题</span>
        <button onclick="toggleMark()" class="ml-auto text-sm px-3 py-1 rounded-md border transition
          ${exam.marks[q.id]?'border-amber-500 text-amber-600 bg-amber-50':'border-slate-300 text-slate-500 hover:border-amber-400'}">
          ${exam.marks[q.id]?'🚩 已标记':'☆ 标记本题'}</button>
      </div>
      ${passageBlock(q)}
      <h2 class="font-semibold text-base sm:text-lg leading-relaxed mb-3">${q.q}</h2>
      ${q.type==='multi'?'<p class="text-xs text-amber-600 mb-2">提示：本题为多选题，请选择所有正确选项</p>':''}
      <div class="space-y-2.5">${questionOptionsHTML(q,sel)}</div>
      <div class="flex items-center justify-between mt-6 pt-4 border-t border-slate-100">
        <button onclick="prevQ()" ${exam.idx===0?'disabled':''} class="px-4 py-2 rounded-lg border border-slate-300 text-sm disabled:opacity-40 hover:bg-slate-50">← 上一题</button>
        <span class="text-xs text-slate-400">${exam.idx+1} / ${TOTAL_Q}</span>
        ${exam.idx<TOTAL_Q-1
          ?'<button onclick="nextQ()" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold">下一题 →</button>'
          :'<button onclick="submitConfirm()" class="px-5 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-semibold">提交试卷</button>'}
      </div>
    </div>`;
}

function selectOpt(k){
  const q=QUESTIONS[exam.idx], id=q.id;
  if(q.type==='single') exam.answers[id]=[k];
  else{
    const cur=exam.answers[id]||[];
    exam.answers[id]=cur.includes(k)?cur.filter(x=>x!==k):[...cur,k];
  }
  saveDraft();
  renderExamQuestion();
  syncCells();
}
function toggleMark(){
  const id=QUESTIONS[exam.idx].id;
  exam.marks[id]=!exam.marks[id];
  if(!exam.marks[id]) delete exam.marks[id];
  saveDraft(); renderExamQuestion(); syncCells();
}
function jump(i){ exam.idx=i; saveDraft(); renderExamQuestion(); syncCells(); closeSheet(); window.scrollTo(0,0); }
function prevQ(){ if(exam.idx>0){ exam.idx--; saveDraft(); renderExamQuestion(); syncCells(); } }
function nextQ(){ if(exam.idx<TOTAL_Q-1){ exam.idx++; saveDraft(); renderExamQuestion(); syncCells(); window.scrollTo(0,0); } }

/* ---------- 阅卷 ---------- */
function gradeAll(answers){
  const weight={listening:0,reading:0,translation:0};
  const details=[]; let answered=0, perfect=0;
  QUESTIONS.forEach(q=>{
    const sel=answers[q.id]||[];
    if(sel.length) answered++;
    const ratio=ratioOf(q,sel);
    weight[q.section]+=ratio;
    if(ratio===1 && sel.length) perfect++;
    details.push({id,sel,ratio});
  });
  const l=Math.round(weight.listening/15*SEC_MAX.listening);
  const r=Math.round(weight.reading/20*SEC_MAX.reading);
  const t=Math.round(weight.translation/10*SEC_MAX.translation);
  const total=l+r+t;
  return { date:Date.now(), l,r,t,total,
    acc:Math.round((l+r+t)/FULL*100),
    answered, perfect, details,
    used:EXAM_MIN*60-exam.remaining };
}

function finishExam(auto){
  if(timerId){ clearInterval(timerId); timerId=null; }
  window.onbeforeunload=null;
  if(auto && speechSynthesis) speechSynthesis.cancel();
  const res=gradeAll(exam.answers);
  res.auto=auto;
  history.push(res); LS.set(K.history,history);
  res.details.filter(d=>d.ratio<1).forEach(d=>addWrong(d.id,'exam',false));
  LS.set(K.wrong,wrongBook);
  LS.del(K.draft);
  lastResult=res; exam=null;
  go('result');
}

/* ============================================================
 * 九、专项刷题

function startPractice(sec){
  const ids=QUESTIONS.filter(q=>!sec||q.section===sec).map(q=>q.id);
  practice={ids,idx:0,sel:[],revealed:false,results:{},mode:'practice',sec};
  go('practice');
}
function startRedo(){
  if(!wrongBook.length) return;
  practice={ids:[...wrongBook].sort((a,b)=>a-b),idx:0,sel:[],revealed:false,results:{},mode:'redo'};
  go('practice');
}
function pQuestion(){ return QMAP[practice.ids[practice.idx]]; }

function passageBlockP(q){
  const p=PASSAGES[q.group]; if(!p) return '';
  const first=!practice.idx || QMAP[practice.ids[practice.idx-1]].group!==q.group;
  if(p.type==='audio'){
    return first?audioCard(q.group):`<details class="bg-white border border-slate-200 rounded-lg"><summary class="p-3 text-sm text-slate-600">🎧 重听本段录音</summary><div class="px-3 pb-3">${audioCard(q.group)}</div></details>`;
  }
  let body=p.dir?`<p class="text-sm text-slate-500 mb-2">${p.dir}</p>`:'';
  if(p.type==='match') body+='<div class="space-y-3">'+p.paragraphs.map(x=>`<p class="text-[15px] leading-relaxed"><b class="text-blue-700 mr-1">[${x.k}]</b>${x.t}</p>`).join('')+'</div>';
  else body+=`<p class="text-[15px] leading-relaxed">${p.text.replace(/\{\{(\d+)\}\}/g,'<b class="text-blue-700"> [$1] </b>')}</p>`;
  return `<details ${first?'open':''} class="passage-details bg-white border border-slate-200 rounded-lg mb-4">
    <summary class="p-3 text-sm font-semibold text-slate-700">📖 ${p.title}</summary><div class="px-4 pb-4">${body}</div></details>`;
}

function viewPractice(){
  if(!practice){ return startPracticeChoose(); }
  const total=practice.ids.length;
  if(practice.idx>=total) return practiceSummary();
  const q=pQuestion();
  return `
  <div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-3 text-sm">
      <span class="font-semibold text-slate-700">${practice.mode==='redo'?'错题重做':'专项刷题'} · ${SECTIONS[q.section].name}</span>
      <span class="text-slate-400">${practice.idx+1} / ${total} · 进度 ${Math.round(practice.idx/total*100)}%</span>
    </div>
    <div class="h-1.5 bg-slate-200 rounded-full mb-4 overflow-hidden"><div class="h-full bg-blue-600 transition-all" style="width:${practice.idx/total*100}%"></div></div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 sm:p-5">
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <span class="text-xs px-2 py-0.5 rounded ${SECTIONS[q.section].cls} font-semibold">${SECTIONS[q.section].name}</span>
        <span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600">${q.type==='multi'?'多选题':'单选题'}</span>
      </div>
      ${passageBlockP(q)}
      <h2 class="font-semibold text-base sm:text-lg leading-relaxed mb-3">${q.q}</h2>
      ${q.type==='multi'?'<p class="text-xs text-amber-600 mb-2">多选题：选择所有正确选项</p>':''}
      <div class="space-y-2.5">
        ${Object.entries(q.o).map(([k,v])=>{
          const on=practice.sel.includes(k);
          let cls='border-slate-300 bg-white hover:border-blue-400 hover:bg-blue-50/50';
          if(practice.revealed){
            if(q.a.includes(k)) cls='opt-ok border-green-500 bg-green-50';
            else if(on) cls='opt-bad border-red-400 bg-red-50';
          }else if(on) cls='opt-act border-blue-600 bg-blue-50 ring-1 ring-blue-600';
          return `<button ${practice.revealed?'disabled':''} onclick="pSelect('${k}')" class="w-full flex items-start gap-3 p-3 rounded-lg border text-left transition ${cls}">
            <span class="letter-badge mt-0.5 ${practice.revealed&&q.a.includes(k)?'!bg-green-600 !border-green-600':practice.revealed&&on?'!bg-red-600 !border-red-600':''}">${k}</span>
            <span class="flex-1 text-[15px]">${v}</span></button>`;
        }).join('')}
      </div>
      ${practice.revealed?`
        <div class="mt-4 rounded-lg p-3.5 border ${practice.lastRatio===1?'border-green-200 bg-green-50':'border-red-200 bg-red-50'}">
          <p class="font-semibold ${practice.lastRatio===1?'text-green-700':'text-red-600'} mb-1">
            ${practice.lastRatio===1?'✔ 回答正确':(practice.sel.length?'✘ 回答错误':'未作答')}　
            <span class="text-slate-500 font-normal text-sm">正确答案：${q.a.join('、')}</span></p>
          <p class="text-sm text-slate-600"><b>解析：</b>${q.e}</p>
          ${PASSAGES[q.group]?.type==='audio'?`<p class="text-xs text-slate-500 mt-2"><b>听力原文：</b>${PASSAGES[q.group].text}</p>`:''}

          ? `<button onclick="pNext()" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold">${practice.idx===total-1?'查看结果 →':'下一题 →'}</button>`
          : `<button onclick="pSubmit()" ${practice.sel.length?'':'disabled'} class="px-5 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold disabled:opacity-40">提交答案</button>`}
      </div>
    </div>
  </div>`;
}

function startPracticeChoose(){
  const cats=[
    {sec:'listening',name:'听力理解',n:15,d:'新闻 / 对话 / 篇章',color:'border-blue-500 bg-blue-50 text-blue-700'},
    {sec:'reading',name:'阅读理解',n:20,d:'词汇 / 匹配 / 细读',color:'border-teal-500 bg-teal-50 text-teal-700'},
    {sec:'translation',name:'翻译',n:10,d:'语法句型选择最佳译法',color:'border-amber-500 bg-amber-50 text-amber-700'},
    {sec:null,name:'全部题型',n:45,d:'整套题库顺序练习',color:'border-slate-500 bg-slate-50 text-slate-700'}
  ];
  return `
  <div class="max-w-3xl mx-auto">

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        </button>`).join('')}

function pSelect(k){
  const q=pQuestion();
  if(q.type==='single') practice.sel=[k];
  else practice.sel=practice.sel.includes(k)?practice.sel.filter(x=>x!==k):[...practice.sel,k];
  renderPracticeOnly();
}
function pSubmit(){
  const q=pQuestion(), ratio=ratioOf(q,practice.sel);
  practice.revealed=true; practice.lastRatio=ratio;
  practice.results[q.id]=ratio;
  /* 记录刷题统计 */
  const rec=pLog[q.id]||{n:0,c:0};
  rec.n++; if(ratio===1) rec.c++; pLog[q.id]=rec; LS.set(K.log,pLog);
  /* 错题入库 / 重做正确则移除 */
  if(ratio<1) addWrong(q.id,'practice',false);
  if(practice.mode==='redo' && ratio===1) removeWrong(q.id,false);
  renderPracticeOnly();
}
function pNext(){ practice.idx++; practice.sel=[]; practice.revealed=false; renderPracticeOnly(); window.scrollTo(0,0); }
function exitPractice(){ practice=null; go('home'); }
function renderPracticeOnly(){ $('#app').innerHTML=viewPractice(); }

function practiceSummary(){
  const entries=Object.entries(practice.results);
  const weighted=entries.reduce((a,[,r])=>a+r,0);
  const perfect=entries.filter(([,r])=>r===1).length;
  const acc=Math.round(weighted/entries.length*100);
  return `
  <div class="max-w-md mx-auto bg-white rounded-xl border border-slate-200 shadow-sm p-6 text-center">
    <p class="text-5xl mb-3">${acc>=80?'🏆':acc>=60?'👍':'💪'}</p>
    <h1 class="text-xl font-bold text-slate-800">${practice.mode==='redo'?'错题重做完成':'本组练习完成'}</h1>
    <div class="grid grid-cols-3 gap-2 my-5">
      <div class="bg-slate-50 rounded-lg py-3"><p class="text-xs text-slate-500">答对</p><p class="text-xl font-bold text-green-600">${perfect}</p></div>
      <div class="bg-slate-50 rounded-lg py-3"><p class="text-xs text-slate-500">总题数</p><p class="text-xl font-bold text-slate-800">${entries.length}</p></div>
      <div class="bg-slate-50 rounded-lg py-3"><p class="text-xs text-slate-500">正确率</p><p class="text-xl font-bold text-blue-600">${acc}%</p></div>
    </div>
    ${practice.mode==='redo'?`<p class="text-sm text-slate-500 mb-4">做对的错题已自动移出错题本</p>`:''}
    <div class="flex flex-col gap-3">
      <button onclick="practice=null;go('wrong')" class="w-full border border-slate-300 py-2.5 rounded-lg">查看错题本</button>
      <button onclick="practice=null;go('home')" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold">返回首页</button>
    </div>
  </div>`;
}

/* ============================================================
 * 十、错题本
 * ============================================================ */
function addWrong(id,from,save=true){
  if(!wrongBook.includes(id)) wrongBook.push(id);
  if(save) LS.set(K.wrong,wrongBook);
}
function removeWrong(id,save=true){
  wrongBook=wrongBook.filter(x=>x!==id);
  if(save) LS.set(K.wrong,wrongBook);
  if($('#app') && !exam && (!practice||practice.mode!=='redo')) renderW();
}
function clearWrong(){
  if(!wrongBook.length) return;
  if(confirm(`确定清空全部 ${wrongBook.length} 道错题吗？此操作不可恢复。`)){
    wrongBook=[]; LS.set(K.wrong,wrongBook); renderW();
  }
}
function renderW(){ $('#app').innerHTML=viewWrong(); }

function viewWrong(){
  const ids=[...wrongBook].sort((a,b)=>a-b);
  const cnt={listening:0,reading:0,translation:0};
  ids.forEach(id=>cnt[QMAP[id].section]++);
  return `
  <div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-lg font-bold text-slate-800">错题本 <span class="text-slate-400 font-normal">（共 ${ids.length} 题）</span></h1>
      <div class="flex gap-2">
        <button onclick="startRedo()" ${ids.length?'':'disabled'} class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-sm font-semibold disabled:opacity-40">错题重做</button>
        <button onclick="clearWrong()" ${ids.length?'':'disabled'} class="px-3 py-1.5 rounded-lg border border-red-400 text-red-500 text-sm disabled:opacity-40">一键清空</button>
      </div>
    </div>
    ${ids.length?`
      <div class="flex gap-2 mb-4 text-xs">
        <span class="px-2 py-1 rounded bg-blue-50 text-blue-700">听力 ${cnt.listening}</span>
        <span class="px-2 py-1 rounded bg-teal-50 text-teal-700">阅读 ${cnt.reading}</span>
        <span class="px-2 py-1 rounded bg-amber-50 text-amber-700">翻译 ${cnt.translation}</span>
      </div>
      <div class="space-y-3">
        ${ids.map(id=>{ const q=QMAP[id];
          return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
            <div class="flex items-start gap-2 mb-3">
              <span class="text-xs px-2 py-0.5 rounded mt-0.5 ${SECTIONS[q.section].cls} font-semibold">${SECTIONS[q.section].short}</span>
              <h2 class="font-semibold text-[15px] flex-1 leading-relaxed">${q.id}. ${q.q}</h2>
              <button onclick="removeWrong(${id})" class="text-slate-400 hover:text-red-500 text-sm" title="移除">✕</button>
            </div>
            <div class="space-y-1.5">
              ${Object.entries(q.o).map(([k,v])=>`
                <div class="flex items-start gap-2 p-2 rounded border text-sm ${q.a.includes(k)?'border-green-500 bg-green-50':'border-slate-200'}">
                  <span class="letter-badge ${q.a.includes(k)?'!bg-green-600 !border-green-600':''}">${k}</span>
                  <span class="flex-1">${v}</span>${q.a.includes(k)?'<span class="text-green-600 text-xs mt-1">正确答案</span>':''}</div>`).join('')}
            </div>
            <p class="text-sm text-slate-600 bg-slate-50 rounded p-2.5 mt-2"><b>解析：</b>${q.e}</p>
          </div>`;
        }).join('')}
      </div>`
      :`<div class="bg-white rounded-xl border border-dashed border-slate-300 py-16 text-center">
          <p class="text-4xl mb-2">📭</p><p class="text-slate-400 text-sm">错题本是空的，刷题或模考中的错题会自动收录到这里</p>
        </div>`}
  </div>`;
}

/* ============================================================
 * 十一、历史成绩
 * ============================================================ */
function scoreChart(records){
  const w=720,h=230,padL=42,padR=18,padT=18,padB=30;
  const xs=i=>records.length===1?(w/2):padL+i*((w-padL-padR)/(records.length-1));
  const ys=v=>h-padB-(v/FULL)*(h-padB-padT);
  const pts=records.map((r,i)=>`${xs(i).toFixed(1)},${ys(r.total).toFixed(1)}`).join(' ');
  const y425=ys(PASS);
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full">
    <line x1="${padL}" y1="${ys(0)}" x2="${w-padR}" y2="${ys(0)}" stroke="#e2e8f0"/>
    <line x1="${padL}" y1="${y425}" x2="${w-padR}" y2="${y425}" stroke="#fca5a5" stroke-dasharray="5 4"/>
    <text x="${w-padR+2}" y="${y425+4}" font-size="11" fill="#ef4444" text-anchor="end">425</text>
    <text x="${w-padR+2}" y="${ys(710)+4}" font-size="11" fill="#94a3b8" text-anchor="end">710</text>
    <polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
    ${records.map((r,i)=>`
      <circle cx="${xs(i)}" cy="${ys(r.total)}" r="4" fill="${r.total>=PASS?'#16a34a':'#dc2626'}" stroke="#fff" stroke-width="1.5"/>
      <text x="${xs(i)}" y="${h-padB+18}" font-size="10.5" fill="#94a3b8" text-anchor="middle">
        ${new Date(r.date).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})}</text>`).join('')}
  </svg>`;
}
function delHistory(date){
  if(confirm('确定删除这条模考记录吗？')){
    history=history.filter(r=>r.date!==date); LS.set(K.history,history);
    $('#app').innerHTML=viewHistory();
  }
}
function clearHistory(){
  if(!history.length) return;
  if(confirm('确定清空全部历史成绩吗？')){
    history=[]; LS.set(K.history,history); $('#app').innerHTML=viewHistory();
  }
}
function viewHistory(){
  const recs=[...history].reverse();
  const avg=recs.length?Math.round(recs.reduce((a,b)=>a+b.total,0)/recs.length):0;
  const best=recs.length?Math.max(...recs.map(r=>r.total)):0;
  const passN=recs.filter(r=>r.total>=PASS).length;
  return `
  <div class="max-w-4xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
      <h1 class="text-lg font-bold text-slate-800">历史成绩</h1>
      ${recs.length?'<button onclick="clearHistory()" class="text-sm text-red-500 hover:underline">清空记录</button>':''}
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      ${[['模考次数',recs.length],['历史最高',best],['平均分',avg],['合格次数',passN]].map(([l,v])=>`
        <div class="bg-white rounded-xl border border-slate-200 p-4 text-center shadow-sm">
          <p class="text-xs text-slate-500">${l}</p><p class="text-2xl font-bold text-slate-800 mt-1">${v||'--'}</p></div>`).join('')}
    </div>
    <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
      <h2 class="font-bold text-slate-800 mb-2">分数走势</h2>
      ${recs.length?scoreChart(recs):'<p class="text-slate-400 text-sm text-center py-10">暂无成绩，完成一次模考后这里会显示分数曲线</p>'}
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="hidden sm:grid grid-cols-[1.4fr_1fr_1fr_1fr_1fr_0.6fr] text-xs text-slate-500 bg-slate-50 px-4 py-2.5 font-semibold">
        <span>考试时间</span><span>总分</span><span>听力</span><span>阅读</span><span>翻译</span><span>正确率</span></div>
      ${recs.length?`<div class="divide-y divide-slate-100">
        ${recs.map(r=>`
          <div class="grid grid-cols-2 sm:grid-cols-[1.4fr_1fr_1fr_1fr_1fr_0.6fr] items-center px-4 py-3 text-sm">
            <span class="text-slate-500 text-xs sm:text-sm">${new Date(r.date).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
            <b class="${r.total>=PASS?'text-green-600':'text-red-500'}">${r.total}</b>
            <span class="text-slate-600">${r.l}</span><span class="text-slate-600">${r.r}</span><span class="text-slate-600">${r.t}</span>
            <span class="flex items-center justify-between gap-1 text-slate-600">${r.acc}%
              <button onclick="delHistory(${r.date})" class="text-slate-300 hover:text-red-500">✕</button></span>
          </div>`).join('')}
      </div>`:'<p class="text-slate-400 text-sm text-center py-10">暂无模考记录</p>'}
    </div>
  </div>`;
}

/* ============================================================
 * 十二、重置数据
 * ============================================================ */
function resetAll(){
  if(confirm('将清除本机所有模考记录、错题本、刷题记录与考试缓存，确定继续吗？')){
    Object.values(K).forEach(k=>LS.del(k));
    wrongBook=[]; history=[]; pLog={}; lastResult=null;
    go('home');
  }
}

/* ============================================================
 * 启动
 * ============================================================ */
go('home');
</script>
</body>
